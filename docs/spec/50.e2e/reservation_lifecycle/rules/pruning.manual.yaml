schema_version: 1

component_pruning:
  - id: stop_when_continue_flow_false
    description: component state の continue_flow が false の場合、依存する後続componentを除外する。
  - id: canonical_target_for_continue_flow_false
    description: continue_flow が false の失敗系は、対象差で期待結果が変わらないため代表Member/Resourceだけを生成する。
  - id: embed_success_prerequisite_goals
    description: 資源登録成功は予約・無効化等の後続ケースの前提variantとして確認し、単独goal caseを生成しない。
  - id: remove_unreachable_dependencies
    description: 前提component stateが成立しないgoal variantは生成対象から除外する。
  - id: dedupe_same_component_state_evidences
    description: 同じcomponent stateを証明する同一evidenceはケース内で重複させない。

state_rules:
  - id: register_forbidden_stops_lifecycle
    when:
      component: resource_catalog
      state: register_forbidden
    skip_components:
      - reservation_booking
      - reservation_visibility
      - reservation_cancellation
      - resource_control
  - id: deactivated_resource_rejects_booking
    when:
      component: resource_control
      state: deactivated
    skip_actions:
      - component: reservation_booking
        action: book_slot
        state: booked
  - id: cancelled_reservation_stops_cancellation
    when:
      component: reservation_cancellation
      state: cancelled
    skip_actions:
      - component: reservation_cancellation
        action: cancel_reservation
        state: cancelled
