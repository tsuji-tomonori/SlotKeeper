schema_version: 1

component:
  id: resource_catalog
  title: Resource Catalog
  purpose: >
    管理者が会議室や備品を予約対象として登録し、
    利用者が有効な資源を一覧から選べる状態にする。
  aggregate:
    - Resource

business_invariants:
  - id: registered_resource_listed
    text: 登録成功後、資源一覧に有効な資源として表示される。
  - id: admin_only_registration
    text: 管理者グループに属さない利用者は資源を登録できない。

targets:
  primary:
    - resource
