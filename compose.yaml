x-api-env: &api-env
  SLOT_DATABASE_URL: postgresql+psycopg://slotkeeper:local-only@db:5432/slotkeeper
  SLOT_ISSUER: http://localhost:8080/realms/slotkeeper
  SLOT_JWKS_URL: http://oidc:8080/realms/slotkeeper/protocol/openid-connect/certs
services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: slotkeeper
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: slotkeeper
    volumes: [data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U slotkeeper]
      interval: 2s
      timeout: 5s
      retries: 30
    cpus: 1
    mem_limit: 2g
  oidc:
    image: quay.io/keycloak/keycloak:26.3.4
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: 'false'
      KC_HEALTH_ENABLED: 'true'
    ports: ['8080:8080']
    volumes: ['./local/realm.json:/opt/keycloak/data/import/realm.json:ro']
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3 | grep 200'"]
      interval: 5s
      timeout: 5s
      retries: 60
  migrate:
    build: {context: ., target: runtime}
    environment: *api-env
    command: [python, -m, tools.project.migrate, --seed]
    depends_on:
      db: {condition: service_healthy}
    restart: 'no'
  api:
    build: {context: ., target: runtime}
    environment: *api-env
    ports: ['8000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
      oidc: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 30
    cpus: 1
    mem_limit: 2g
  web:
    build: {context: ., target: web}
    ports: ['4321:4321']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4321').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 3s
      timeout: 5s
      retries: 30
  verify-db:
    image: postgres:17.6-bookworm
    profiles: [test]
    environment:
      POSTGRES_USER: slotkeeper
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: slotkeeper_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U slotkeeper]
      interval: 2s
      timeout: 5s
      retries: 30
  verify:
    build: {context: ., target: verify}
    profiles: [test]
    environment:
      SLOT_DATABASE_URL: postgresql+psycopg://slotkeeper:test-only@verify-db:5432/slotkeeper_test
      SLOT_PERF_DATABASE_URL: postgresql+psycopg://slotkeeper:local-only@db:5432/slotkeeper
      SLOT_TEST_DB: '1'
      SLOT_WEB_URL: http://web:4321
      SLOT_API_URL: http://api:8000
      SLOT_OIDC_INTERNAL: http://oidc:8080
      SLOT_REVISION: ${SLOT_REVISION:-local-worktree}
      SLOT_RUN_ID: ${SLOT_RUN_ID:-local}
    volumes:
      - ./artifacts:/app/artifacts
      - ./src:/app/src
      - ./docs/spec:/app/docs/spec
      - ./docs/reference-tools.md:/app/docs/reference-tools.md
      - ./docs/requirements:/app/docs/requirements
      - ./spec/requirements:/app/spec/requirements
      - ./.dev-standard/design.json:/app/.dev-standard/design.json
      - ./frontend/src/generated:/app/frontend/src/generated
    depends_on:
      verify-db: {condition: service_healthy}
      web: {condition: service_healthy}
  docs:
    image: nginx:1.28.0-alpine
    profiles: [docs]
    ports: ['4173:80']
    volumes: ['./artifacts/site:/usr/share/nginx/html/SlotKeeper:ro', './local/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://localhost/SlotKeeper/ >/dev/null']
      interval: 3s
      timeout: 5s
      retries: 10
  perf:
    build: {context: ., target: verify}
    profiles: [perf]
    command: [--performance-only]
    environment:
      SLOT_DATABASE_URL: postgresql+psycopg://slotkeeper:local-only@db:5432/slotkeeper
      SLOT_API_URL: http://api:8000
      SLOT_OIDC_INTERNAL: http://oidc:8080
      SLOT_REVISION: ${SLOT_REVISION:-local-worktree}
      SLOT_RUN_ID: ${SLOT_RUN_ID:-local}
    volumes: ['./artifacts:/app/artifacts']
    depends_on:
      api: {condition: service_healthy}
  cloud-tests:
    build: {context: ., target: verify}
    profiles: [cloud]
    entrypoint: [python, -m, tools.project.cloud]
    environment:
      SLOT_CLOUD_API: ${SLOT_CLOUD_API:-}
      SLOT_CLOUD_TOKEN: ${SLOT_CLOUD_TOKEN:-}
      SLOT_CLOUD_RESOURCE_ID: ${SLOT_CLOUD_RESOURCE_ID:-}
      SLOT_REVISION: ${SLOT_REVISION:-local-worktree}
      SLOT_RUN_ID: ${SLOT_RUN_ID:-local}
    volumes: ['./artifacts:/app/artifacts']
volumes:
  data:
